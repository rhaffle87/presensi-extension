name: CI Pipeline

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  validate-and-test:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Test Suite (Unit & E2E)
        run: npm test

      - name: Verify Build & Packaging
        run: npm run build

      - name: Verify Release Artifacts Exist
        run: |
          test -f release.zip || (echo "release.zip missing" && exit 1)
          test -f dist/chrome-webstore.zip || (echo "chrome-webstore.zip missing" && exit 1)
          test -f dist/firefox-amo.zip || (echo "firefox-amo.zip missing" && exit 1)
          echo "All release archives compiled successfully."
